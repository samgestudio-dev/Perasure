# PeraSure in Dev Mode (samge.studio/devmode, repo devmode-platform). The site needs no deploy: the Worker reads main straight from
# GitHub, so a push is live within about 20 seconds. This workflow publishes devmode/data/pages.js, iterations.js and status.js as JSON
# on the branch devmode-mcp, for the hosted MCP server (Cloudflare Workers can't run those scripts) — on every change to them.
# The Worker itself lives in devmode-platform (worker/) and is deployed from there.
name: Dev Mode live

on:
  push:
    branches: [main]
    paths: ['devmode/data/**', 'tools/devmode-mcp-data.mjs', '.github/workflows/devmode-live.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: devmode-live
  cancel-in-progress: false

jobs:
  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Publish the MCP data (branch devmode-mcp)
        run: |
          mkdir out && node tools/devmode-mcp-data.mjs out/data.json
          cd out
          echo "Dev Mode data of ${GITHUB_SHA} for the hosted MCP server (devmode-platform worker/index.js). Made by the Dev Mode live workflow; replaced each time." > README.md
          git init -q -b devmode-mcp
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Dev Mode data of ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" devmode-mcp
          echo "MCP data published for ${GITHUB_SHA::7}" >> "$GITHUB_STEP_SUMMARY"
