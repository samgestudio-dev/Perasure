<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f0f5f4">
<title>PeraSure Playground</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;background:#f0f5f4}
  #root:empty::after{content:"";display:block;height:100vh}
</style>
</head>
<body>
<div id="root"></div>

<script src="vendor/react@18.3.1/react.production.min.js"></script>
<script src="vendor/react-dom@18.3.1/react-dom.production.min.js"></script>
<script src="vendor/mui-material@5.18.0/material-ui.production.min.js"></script>
<script src="assets/playground-ui.js"></script>
<script src="animations/animations.js"></script>
<script>
/* ---- Prototype registry (the "Prototypes" tab) -----------------------------------------
   To add a prototype: put its files in prototypes/<slug>/ and add one entry below.
   The first variant is the recommended one. Animations live in animations/animations.js. */
var DEMOS = [
  {
    title: 'Loading page',
    tag: 'Loading',
    desc: 'Full-screen loading state: the PeraSure coin with the animated dots.',
    variants: [
      { name: 'Standard', note: 'Plays on open', href: 'prototypes/loading-page/index.html' }
    ]
  },
  {
    title: 'OTP sheet morph',
    tag: 'Loan',
    desc: 'Loan confirmation → “Verify it’s you” sheet morphs into code entry, with the digits filling in.',
    variants: [
      { name: 'Standard', note: 'Tap “Get verification code” to start', href: 'prototypes/otp-sheet-morph/index.html' }
    ]
  },
  {
    title: 'Order submit',
    tag: 'Loan',
    desc: '“Confirming your loan details…” loader with the per-letter text animation.',
    variants: [
      { name: 'Standard', note: 'Tap anywhere to replay', href: 'prototypes/order-submit/index.html' }
    ]
  },
  {
    title: 'Landing page',
    tag: 'Website',
    desc: 'PeraSure marketing site — hero and scroll motion. A full website, not a phone screen.',
    variants: [
      { name: 'Standard', note: 'Large file (about 15 MB), give it a moment to load', href: 'prototypes/landing-page/index.html' }
    ]
  },
  {
    title: 'Withdraw fund flow',
    tag: 'Loan',
    desc: 'Home → withdraw sheet → amount entry ⇄ order confirmation, with the amount morph, keypad and term pills.',
    variants: [
      { name: 'Standard', note: 'No gradient blur on the header and bottom bar', href: 'prototypes/withdraw-fund-flow/index.html' },
      { name: 'With gradient blur', note: 'Progressive blur on the header and bottom bar', href: 'prototypes/withdraw-fund-flow/with-blur.html' }
    ]
  }
];

</script>
<script>
/* ---- Picker UI (Material UI, see assets/playground-ui.js) --------------------------------
   Two tabs: Prototypes (DEMOS above) and Animations (window.LOTTIES). #animations in the URL
   opens the Animations tab (#lottie still accepted), so "back" from the player lands there. */
(function(){
  var M = MaterialUI, R = React, h = PG.h, Icon = PG.Icon, C = PG.C;
  var LOTTIES = window.LOTTIES || [];

  function fromHash(){ return /^#(animations|lottie)$/.test(location.hash) ? 1 : 0; }

  function TabLabel(p){
    return h(M.Stack, { direction: 'row', spacing: 0.75, alignItems: 'center' },
      h(p.icon, { sx: { fontSize: 18 } }),
      h('span', null, p.text),
      h(M.Box, { component: 'span', sx: {
        fontSize: 11, lineHeight: '16px', fontWeight: 700, px: 0.75, borderRadius: 99,
        bgcolor: p.on ? C.blue50 : 'rgba(20,30,36,0.06)', color: p.on ? 'primary.main' : 'text.secondary' } }, p.n));
  }

  function Segmented(p){
    return h(M.Box, { sx: { p: 0.5, borderRadius: '16px', bgcolor: C.track } },
      h(M.Tabs, {
        value: p.value, onChange: function(e, v){ p.onChange(v); }, variant: 'fullWidth',
        'aria-label': 'Library',
        // The pill indicator's shadow must not be clipped: MUI Tabs hides overflow on the root and scroller.
        sx: { minHeight: 40, overflow: 'visible', '& .MuiTabs-scroller': { overflow: 'visible !important' },
          '& .MuiTabs-flexContainer': { position: 'relative', zIndex: 1 } },
        TabIndicatorProps: { sx: { height: '100%', borderRadius: '12px', bgcolor: '#fff', boxShadow: PG.theme.shadows[2], zIndex: 0 } }
      },
        h(M.Tab, { disableRipple: true, label: h(TabLabel, { icon: Icon.touch, text: 'Prototypes', n: DEMOS.length, on: p.value === 0 }),
          sx: { color: 'text.secondary', '&.Mui-selected': { color: 'text.primary' } } }),
        h(M.Tab, { disableRipple: true, label: h(TabLabel, { icon: Icon.animation, text: 'Animations', n: LOTTIES.length, on: p.value === 1 }),
          sx: { color: 'text.secondary', '&.Mui-selected': { color: 'text.primary' } } })));
  }

  function Tag(p){
    return h(M.Chip, { size: 'small', label: p.label, sx: { bgcolor: C.blue50, color: 'primary.main', border: '1px solid ' + C.blue200 } });
  }

  /* Screenshot of a prototype option, made by tools/prototype-thumbs.py:
     prototypes/<slug>/index.html → preview.webp, <name>.html → preview-<name>.webp (or v.thumb). */
  function thumbOf(v){
    if (v.thumb) return v.thumb;
    var i = v.href.lastIndexOf('/'), dir = v.href.slice(0, i + 1), stem = v.href.slice(i + 1).replace(/\.html$/, '');
    return dir + (stem === 'index' ? 'preview.webp' : 'preview-' + stem + '.webp');
  }
  function Thumb(p){
    var s = R.useState(true), ok = s[0], setOk = s[1];
    if (!ok) return null;
    return h(M.Box, { component: 'img', src: p.src, alt: '', loading: 'lazy', decoding: 'async', onError: function(){ setOk(false); },
      sx: { display: 'block', flex: 'none', width: 56, aspectRatio: '270 / 584', objectFit: 'cover', objectPosition: 'top',
        borderRadius: '10px', bgcolor: '#fff', mr: 1.5, boxShadow: '0 0 0 1px rgba(20,30,36,0.08), 0 2px 6px rgba(16,24,40,0.08)' } });
  }

  function PrototypeCard(p){
    var d = p.d, many = d.variants.length > 1;
    return h(M.Card, null,
      h(M.Box, { sx: { px: 2, pt: 2, pb: 1.5 } },
        h(M.Stack, { direction: 'row', spacing: 1.5, alignItems: 'flex-start' },
          h(M.Box, { sx: { flex: 1, minWidth: 0 } },
            h(M.Typography, { variant: 'h6', component: 'h2' }, d.title),
            h(M.Typography, { variant: 'body2', color: 'text.secondary', sx: { mt: 0.5 } }, d.desc)),
          d.tag ? h(Tag, { label: d.tag }) : null)),
      h(M.Stack, { spacing: 1, sx: { px: 1.25, pb: 1.25 } },
        d.variants.map(function(v, i){
          return h(M.ListItemButton, {
            key: v.href, component: 'a', href: v.href,
            sx: { bgcolor: C.soft, py: 1, pl: 1, pr: 1.25, alignItems: 'center', '&:hover': { bgcolor: '#eef1f3' } }
          },
            h(Thumb, { src: thumbOf(v) }),
            h(M.ListItemText, {
              primary: h(M.Stack, { direction: 'row', spacing: 0.75, alignItems: 'center' },
                h('span', null, v.name),
                i === 0 && many ? h(M.Chip, { size: 'small', label: 'Recommended', color: 'primary', sx: { height: 18, fontSize: 10 } }) : null),
              secondary: v.note,
              primaryTypographyProps: { variant: 'subtitle2', component: 'div' },
              secondaryTypographyProps: { variant: 'caption', sx: { display: 'block', mt: 0.25 } }
            }),
            h(M.Box, { sx: { ml: 1, width: 32, height: 32, borderRadius: 99, display: 'grid', placeItems: 'center',
              bgcolor: '#fff', color: 'text.secondary', boxShadow: PG.theme.shadows[1], flex: 'none' } },
              h(Icon.next, { sx: { fontSize: 20 } })));
        })));
  }

  function MiniTag(p){
    return h(M.Box, { component: 'span', sx: { fontSize: 10, lineHeight: '16px', fontWeight: 700, letterSpacing: '0.02em',
      px: 0.75, borderRadius: '6px', color: p.strong ? 'primary.main' : 'text.secondary',
      bgcolor: p.strong ? C.blue50 : 'rgba(20,30,36,0.05)' } }, p.label);
  }

  function AnimationCard(p){
    var a = p.a;
    var how = a.success ? 'Loading → success' : a.intro ? 'Intro → loop' : 'Plays once';
    return h(M.Card, { sx: { minWidth: 0 } },
      h(M.CardActionArea, { component: 'a', href: 'animations/player.html?a=' + encodeURIComponent(a.slug), sx: { borderRadius: '22px', overflow: 'hidden' } },
        // Full-bleed thumbnail: fills the top of the card, clipped by the card's corners — no stroke of its own.
        h(M.Box, { component: 'img', src: 'animations/' + a.slug + '/' + a.preview, alt: '', loading: 'lazy', decoding: 'async',
          sx: { display: 'block', width: '100%', aspectRatio: '4 / 3', objectFit: 'contain', p: 0.75, bgcolor: '#fff' } }),
        h(M.Box, { sx: { px: 1.5, pt: 1.25, pb: 1.5, borderTop: '1px solid rgba(20,30,36,0.06)' } },
          h(M.Typography, { variant: 'subtitle2', sx: { display: '-webkit-box', WebkitLineClamp: 2, WebkitBoxOrient: 'vertical', overflow: 'hidden' } }, a.title),
          h(M.Stack, { direction: 'row', spacing: 0.75, alignItems: 'center', sx: { mt: 0.5 } },
            h(M.Typography, { variant: 'caption', color: 'text.secondary', noWrap: true }, how),
            a.gsap ? null : h(MiniTag, { label: 'Lottie only' })))));
  }

  function App(){
    var s = R.useState(fromHash()), tab = s[0], setTab = s[1];
    R.useEffect(function(){
      function onHash(){ setTab(fromHash()); }
      window.addEventListener('hashchange', onHash);
      return function(){ window.removeEventListener('hashchange', onHash); };
    }, []);
    function pick(v){
      setTab(v);
      try { history.replaceState(null, '', v === 1 ? '#animations' : location.pathname + location.search); } catch (e) {}
    }
    return h(M.Container, { maxWidth: 'sm', disableGutters: true, sx: {
        px: 2, pt: 'calc(env(safe-area-inset-top, 0px) + 32px)', pb: 'calc(env(safe-area-inset-bottom, 0px) + 32px)', maxWidth: 520 } },
      h(M.Box, { component: 'header', sx: { px: 0.5, pb: 3 } },
        h(M.Typography, { variant: 'overline', color: 'primary' }, 'PeraSure'),
        h(M.Typography, { variant: 'h4', component: 'h1', sx: { mt: 0.25 } }, 'Playground'),
        h(M.Typography, { variant: 'body1', color: 'text.secondary', sx: { mt: 1 } },
          'Interactive prototypes and illustration animations, made to be tried on a real phone.')),
      h(Segmented, { value: tab, onChange: pick }),
      h(M.Typography, { variant: 'body2', color: 'text.secondary', sx: { px: 0.5, mt: 2, mb: 1.5 } },
        tab === 0 ? 'Tap-through product flows with real interactions.' : 'Illustrations, each playable as Lottie or GSAP.'),
      tab === 0
        ? h(M.Stack, { spacing: 1.5, role: 'tabpanel', 'aria-label': 'Prototypes' },
            DEMOS.map(function(d){ return h(PrototypeCard, { key: d.title, d: d }); }))
        : h(M.Box, { role: 'tabpanel', 'aria-label': 'Animations', sx: { display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 1.5 } },
            LOTTIES.map(function(a){ return h(AnimationCard, { key: a.slug, a: a }); })),
      h(M.Stack, { direction: 'row', spacing: 1, alignItems: 'center', sx: { mt: 3, px: 0.5, color: 'text.secondary' } },
        h(Icon.phone, { sx: { fontSize: 16 } }),
        h(M.Typography, { variant: 'caption' }, 'Best viewed on a phone. Animations open one at a time in the player.')));
  }

  PG.mount(document.getElementById('root'), App);
})();
</script>
</body>
</html>
