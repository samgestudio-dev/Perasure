<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f0f5f4">
<title>PeraSure Playground</title>
<style>
  :root{
    --bg:#f0f5f4; --card:#ffffff; --ink:#141e24; --sub:#6a757d; --mute:#97a0a6;
    --line:#e0e3e5; --blue:#2c74be; --blue-50:#f3f8ff; --blue-100:#e4f0ff;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{background:var(--bg);color:var(--ink)}
  body{
    font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;min-height:100vh;
    padding:calc(env(safe-area-inset-top,0px) + 32px) 16px calc(env(safe-area-inset-bottom,0px) + 32px);
  }
  main{max-width:480px;margin:0 auto}
  header{padding:0 4px 24px}
  .eyebrow{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--blue)}
  h1{margin-top:6px;font-size:26px;line-height:32px;font-weight:700;letter-spacing:-.01em}
  header p{margin-top:8px;font-size:14px;line-height:20px;color:var(--sub)}
  .list{display:flex;flex-direction:column;gap:12px}
  .demo{background:var(--card);border-radius:20px;padding:16px;
    box-shadow:0 0 2px rgba(0,1,40,.16),0 4px 12px rgba(0,1,40,.08)}
  .demo-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
  .demo h2{font-size:16px;line-height:22px;font-weight:600}
  .demo .desc{margin-top:4px;font-size:13px;line-height:18px;color:var(--sub)}
  .tag{flex:none;font-size:11px;line-height:16px;font-weight:600;color:var(--blue);background:var(--blue-50);
    border:1px solid #c8deff;border-radius:999px;padding:2px 8px}
  .variants{margin-top:14px;display:flex;flex-direction:column;gap:8px}
  .variant{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit;
    background:#f4f6f7;border-radius:14px;padding:12px 12px 12px 14px;
    transition:background-color .15s ease,transform .12s ease}
  .variant:active{transform:scale(.985);background:#e9edef}
  @media (hover:hover){.variant:hover{background:#eceff1}}
  .variant .name{flex:1;min-width:0;font-size:14px;line-height:20px;font-weight:600}
  .variant .note{display:block;margin-top:2px;font-size:12px;line-height:16px;font-weight:400;color:var(--mute)}
  .variant .go{flex:none;width:28px;height:28px;border-radius:99px;display:grid;place-items:center;background:var(--card);
    color:var(--sub);box-shadow:0 0 2px rgba(0,1,40,.12)}
  .rec{display:inline-block;vertical-align:1px;margin-left:6px;font-size:10px;line-height:14px;font-weight:600;letter-spacing:.02em;
    color:var(--blue);background:var(--blue-50);border-radius:99px;padding:1px 6px}
  .tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;margin:0 0 16px;border-radius:14px;background:#e3eaea}
  .tab{height:40px;border:0;border-radius:10px;background:transparent;font:inherit;font-size:14px;line-height:20px;font-weight:600;
    color:var(--sub);cursor:pointer;touch-action:manipulation;display:inline-flex;align-items:center;justify-content:center;gap:6px;
    transition:background-color .15s ease,color .15s ease}
  .tab[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:0 0 2px rgba(0,1,40,.12),0 2px 6px rgba(0,1,40,.06)}
  .tab .n{font-size:11px;line-height:16px;font-weight:600;color:var(--mute);background:rgba(20,30,36,.06);border-radius:99px;padding:0 6px}
  .tab[aria-selected="true"] .n{color:var(--blue);background:var(--blue-50)}
  [hidden]{display:none!important}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .lot{display:block;min-width:0;text-decoration:none;color:inherit;background:var(--card);border-radius:18px;padding:6px 6px 10px;
    box-shadow:0 0 2px rgba(0,1,40,.16),0 4px 12px rgba(0,1,40,.08);transition:transform .12s ease}
  .lot:active{transform:scale(.97)}
  .lot img{display:block;width:100%;height:auto;aspect-ratio:4/3;object-fit:contain;border-radius:13px;background:#fff}
  .lot h3{margin:4px 6px 0;font-size:13px;line-height:18px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lot p{margin:1px 6px 0;font-size:11px;line-height:16px;color:var(--mute)}
  .cap{margin:-4px 4px 12px;font-size:13px;line-height:18px;color:var(--sub)}
  footer{margin-top:24px;padding:0 4px;font-size:12px;line-height:16px;color:var(--mute)}
  @media (prefers-reduced-motion: reduce){.variant{transition:none}}
</style>
</head>
<body>
<main>
  <header>
    <div class="eyebrow">PeraSure</div>
    <h1>Playground</h1>
    <p>Interactive prototypes and illustration animations, made to be tried on a real phone.</p>
  </header>

  <div class="tabs" role="tablist" aria-label="Library">
    <button class="tab" role="tab" id="tab-motion" aria-controls="list" aria-selected="true">Prototypes <span class="n" id="n-motion"></span></button>
    <button class="tab" role="tab" id="tab-lottie" aria-controls="lottie" aria-selected="false">Animations <span class="n" id="n-lottie"></span></button>
  </div>

  <div id="pane-motion">
    <p class="cap">Tap-through product flows with real interactions.</p>
    <section class="list" id="list" role="tabpanel" aria-label="Prototypes"></section>
  </div>
  <div id="pane-lottie" hidden>
    <p class="cap">Illustrations, each playable as Lottie or GSAP.</p>
    <section class="grid" id="lottie" role="tabpanel" aria-label="Animations"></section>
  </div>

  <footer>Best viewed on a phone. Animations open one at a time in the player.</footer>
</main>

<script src="animations/animations.js"></script>
<script>
/* ---- Demo registry -------------------------------------------------------------
   To add a demo: put its files in prototypes/<slug>/ and add one entry below.
   The first variant is the recommended one. */
var DEMOS = [
  {
    title: 'Loading page',
    tag: 'Loading',
    desc: 'Full-screen loading state: the PeraSure coin with the animated dots.',
    variants: [
      { name: 'Standard', note: 'Plays on open', href: 'prototypes/loading-page/index.html' }
    ]
  },
  {
    title: 'OTP sheet morph',
    tag: 'Loan',
    desc: 'Loan confirmation → “Verify it’s you” sheet morphs into code entry, with the digits filling in.',
    variants: [
      { name: 'Standard', note: 'Tap “Get verification code” to start', href: 'prototypes/otp-sheet-morph/index.html' }
    ]
  },
  {
    title: 'Order submit',
    tag: 'Loan',
    desc: '“Confirming your loan details…” loader with the per-letter text animation.',
    variants: [
      { name: 'Standard', note: 'Tap anywhere to replay', href: 'prototypes/order-submit/index.html' }
    ]
  },
  {
    title: 'Landing page',
    tag: 'Website',
    desc: 'PeraSure marketing site — hero and scroll motion. A full website, not a phone screen.',
    variants: [
      { name: 'Standard', note: 'Large file (about 15 MB), give it a moment to load', href: 'prototypes/landing-page/index.html' }
    ]
  },
  {
    title: 'Withdraw fund flow',
    tag: 'Loan',
    desc: 'Home → withdraw sheet → amount entry ⇄ order confirmation, with the amount morph, keypad and term pills.',
    variants: [
      { name: 'Standard', note: 'No gradient blur on the header and bottom bar', href: 'prototypes/withdraw-fund-flow/index.html' },
      { name: 'With gradient blur', note: 'Progressive blur on the header and bottom bar', href: 'prototypes/withdraw-fund-flow/with-blur.html' }
    ]
  }
];

(function(){
  var list = document.getElementById('list');
  var chev = '<span class="go"><svg width="16" height="16" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M7.5 4.5 13 10l-5.5 5.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>';
  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  list.innerHTML = DEMOS.map(function(d){
    return '<article class="demo">' +
      '<div class="demo-head"><div><h2>' + esc(d.title) + '</h2><p class="desc">' + esc(d.desc) + '</p></div>' +
      (d.tag ? '<span class="tag">' + esc(d.tag) + '</span>' : '') + '</div>' +
      '<div class="variants">' + d.variants.map(function(v, i){
        return '<a class="variant" href="' + esc(v.href) + '">' +
          '<span class="name">' + esc(v.name) + (i === 0 && d.variants.length > 1 ? '<span class="rec">Recommended</span>' : '') + (v.note ? '<span class="note">' + esc(v.note) + '</span>' : '') + '</span>' + chev + '</a>';
      }).join('') + '</div></article>';
  }).join('');

  /* ---- Lottie tab: still thumbnails only; tapping one opens the player, which plays
     one animation at a time. The list lives in animations/animations.js. */
  var LOTTIES = window.LOTTIES || [];
  document.getElementById('lottie').innerHTML = LOTTIES.map(function(a){
    var how = (a.success ? 'Loading → success' : a.intro ? 'Intro → loop' : 'Plays once') + (a.gsap ? ' · Lottie, GSAP' : ' · Lottie');
    return '<a class="lot" href="animations/player.html?a=' + encodeURIComponent(a.slug) + '">' +
      '<img src="animations/' + esc(a.slug) + '/' + esc(a.preview) + '" alt="" loading="lazy" decoding="async" width="300" height="300">' +
      '<h3>' + esc(a.title) + '</h3><p>' + how + '</p></a>';
  }).join('');
  document.getElementById('n-motion').textContent = DEMOS.length;
  document.getElementById('n-lottie').textContent = LOTTIES.length;

  /* ---- Tabs: #animations / #motion in the URL (#lottie still accepted for old links), so "back" from a player lands on the right tab. */
  function show(tab){
    var lot = tab === 'lottie';
    document.getElementById('tab-motion').setAttribute('aria-selected', String(!lot));
    document.getElementById('tab-lottie').setAttribute('aria-selected', String(lot));
    document.getElementById('pane-motion').hidden = lot;
    document.getElementById('pane-lottie').hidden = !lot;
  }
  function pick(tab){
    show(tab);
    try { history.replaceState(null, '', tab === 'lottie' ? '#animations' : location.pathname + location.search); } catch (e) {}
  }
  document.getElementById('tab-motion').addEventListener('click', function(){ pick('motion'); });
  document.getElementById('tab-lottie').addEventListener('click', function(){ pick('lottie'); });
  function fromHash(){ return /^#(animations|lottie)$/.test(location.hash) ? 'lottie' : 'motion'; }
  show(fromHash());
  window.addEventListener('hashchange', function(){ show(fromHash()); });
})();
</script>
</body>
</html>
