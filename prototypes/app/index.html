  note: 'This is a test environment: pick the account and loan state to see, then use the app as usual. Loading times are made up and vary, as on a real network. A change reloads the app from its opening screen.',

    { key: 'user', label: 'Account', options: [['approved', 'Credit ready'], ['guest', 'Logged out'], ['new', 'New, no application'], ['review', 'Application in review'],

    { key: 'temp', label: 'Temporary credit (₱10,000 until Nov 20)', options: [[1, 'On'], [0, 'Off']], def: 1 },
    { key: 'intro', label: 'Credit limit increase when the app opens (needs temporary credit)', options: [[0, 'Off'], [1, 'On']], def: 0 },

    { key: 'otp', label: 'Verification code', options: [['ok', 'Correct'], ['wrong', 'Wrong first'], ['fail', 'SMS fails first']], def: 'ok' },
    { key: 'kyc', label: 'ID check', options: [['pass', 'Passes'], ['inuse', 'ID already in use'], ['failed', 'Fails']], def: 'pass' },
    { key: 'selfie', label: 'Selfie check', options: [['pass', 'Passes'], ['fail', 'Fails first']], def: 'pass' },
