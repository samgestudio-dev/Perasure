/* Responsive phone page in normal flow. --u = screen width / 360 (capped at 480px wide), set from JS,
   so type and pills scale with the phone; the coin artwork is an SVG that scales with its width. */
:root{ --bg:#0D1620; --text:#EEF5EF; --muted:#9AA7B0; --accent:#3FA0F0; --chip:#1B2834; --ink:#0D1620; --u:1; color-scheme:dark }
html,body{margin:0;background:var(--bg);-webkit-tap-highlight-color:transparent}
body{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;overflow-x:hidden;
  font-family:"PS Hanken",system-ui,sans-serif;touch-action:manipulation}
main{box-sizing:border-box;width:100%;max-width:480px;flex:1;display:flex;flex-direction:column;align-items:center;
  padding-top:calc(env(safe-area-inset-top,0px) + 24px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 24px);
  padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
.space-top{flex:.85 1 0;min-height:16px}
.space-mid{flex:1 1 0;min-height:calc(28px * var(--u))}
#hero{position:relative;display:flex;flex-direction:column;align-items:center;color:var(--text);text-align:center}
#burst{position:absolute;left:50%;top:calc(60px * var(--u));overflow:visible;pointer-events:none;transform:scale(var(--u))}
#label{font-weight:500;font-size:calc(14px * var(--u));line-height:1.43;color:var(--muted)}
#amount{margin-top:calc(6px * var(--u));font-family:"PS Num","PS Hanken",sans-serif;font-weight:700;font-size:calc(64px * var(--u));line-height:1.06;
  letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap;transform-origin:50% 60%}
#delta{display:flex;gap:calc(10px * var(--u));align-items:center;margin-top:calc(12px * var(--u));min-height:calc(30px * var(--u))}
#up{font-family:"PS Num","PS Hanken",sans-serif;padding:calc(5px * var(--u)) calc(12px * var(--u));border-radius:999px;background:var(--accent);color:var(--ink);
  font-weight:700;font-size:calc(15px * var(--u));line-height:1.33;font-variant-numeric:tabular-nums}
#was{font-family:"PS Num","PS Hanken",sans-serif;font-weight:500;font-size:calc(15px * var(--u));line-height:1.33;color:var(--muted);text-decoration:line-through;font-variant-numeric:tabular-nums}
#exp{font-family:"PS Num","PS Hanken",sans-serif;display:inline-flex;align-items:center;gap:calc(7px * var(--u));margin-top:calc(14px * var(--u));
  padding:calc(7px * var(--u)) calc(14px * var(--u)) calc(7px * var(--u)) calc(11px * var(--u));border-radius:999px;background:var(--chip);color:var(--text);
  font-weight:500;font-size:calc(13px * var(--u));line-height:1.38}
#exp svg{flex:none;width:calc(14px * var(--u));height:calc(14px * var(--u))}
/* the coins: full width, but never taller than about 40% of the screen on short phones */
#art{display:block;width:100%;height:auto;max-height:42vh;max-height:42dvh;overflow:visible}
#replay{margin-top:calc(8px * var(--u));border:0;border-radius:999px;padding:calc(10px * var(--u)) calc(18px * var(--u));background:var(--chip);color:var(--text);
  font:600 calc(14px * var(--u))/1.43 "PS Hanken",system-ui,sans-serif;opacity:0;pointer-events:none;cursor:pointer;touch-action:manipulation}
#replay.on{opacity:1;pointer-events:auto}
#replay:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
</style>

    var ln = el('line', { 'stroke-linecap':'round', 'stroke-width':i % 2 ? 2.5 : 3.5, stroke:i % 2 ? WHITE : BLUE }, b);
    tl.set(ln, { opacity:0 }, 0);
    tl.fromTo(ln, { opacity:1, attr:{ x1:ca * 158, y1:sa * 54, x2:ca * 160, y2:sa * 55 } },
      { attr:{ x1:ca * 188, y1:sa * 80, x2:ca * (188 + L), y2:sa * (80 + L * .7) }, duration:.38, ease:'expo.out', immediateRender:false }, at + .03 + (i % 3) * .015);
    tl.to(ln, { opacity:0, duration:.2, ease:'power1.in' }, at + .24);
  }
  /* sparkles: pop in with a turn, twinkle once, then leave outwards from the amount's centre */
  var SP = 'M0 -10 C.9 -2.7 2.7 -.9 10 0 2.7 .9 .9 2.7 0 10 -.9 2.7 -2.7 .9 -10 0 -2.7 -.9 -.9 -2.7 0 -10 Z';
  var stars = [[-200, -26, WHITE, 1.3], [-150, 50, BLUE, .8], [-60, -70, WHITE, .7], [70, -72, BLUE, .9], [190, -30, WHITE, 1.1], [160, 52, WHITE, .75], [20, 74, BLUE, .65]];
  stars.forEach(function(p, i){
    var s = el('path', { d:SP, fill:p[2] }, b);
    tl.set(s, { opacity:0, x:0, y:0, scale:0 }, 0);
    tl.fromTo(s, { x:p[0] * .72, y:p[1] * .72, scale:0, rotation:-60, opacity:1 },
      { x:p[0], y:p[1], scale:p[3], rotation:0, duration:.42, ease:'back.out(2)', immediateRender:false }, at + .04 + i * .03);
    tl.to(s, { scale:p[3] * .7, duration:.12, ease:'sine.inOut', yoyo:true, repeat:1 }, at + .5 + i * .02);
    /* exit: keep travelling away from the centre, shrink and fade */
    tl.to(s, { x:p[0] * 1.7, y:p[1] * 1.7, scale:0, rotation:45, opacity:0, duration:.5, ease:'power2.in' }, at + .82 + i * .025);
  });
}

/* ---------- stars behind the coins keep twinkling: breathe in scale, tilt a little, each on its own beat ---------- */
var twinkles = [];
function twinkle(){
  twinkles.forEach(function(t){ t.kill(); }); twinkles = [];
  document.querySelectorAll('.tw').forEach(function(g, i){
    var d = +g.dataset.d, o = g.dataset.o;
    var t = gsap.timeline({ repeat:-1, delay:i * .17 });
    t.to(g, { scale:.62, rotation:18, svgOrigin:o, duration:d * .45, ease:'sine.inOut' })
     .to(g, { scale:1.08, rotation:-6, svgOrigin:o, duration:d * .35, ease:'sine.inOut' })
     .to(g, { scale:1, rotation:0, svgOrigin:o, duration:d * .2, ease:'sine.out' });
    twinkles.push(t);
  });
}

/* ---------- timeline ---------- */
var tl, NUM = { v:0 };
function frame(){ render(tl.time()); }
function build(){
  if (tl) tl.kill();
  twinkles.forEach(function(t){ t.kill(); }); twinkles = [];
  gsap.set('.tw', { scale:1, rotation:0 });
  NUM.v = CONFIG.from;
  tl = gsap.timeline({ paused:true, onUpdate:frame });
  tl.timeScale(SPEED);

  /* the amount */
  tl.fromTo('#label', { opacity:0, y:6 }, { opacity:1, y:0, duration:.3, ease:'power2.out' }, 0);
  tl.fromTo(amountEl, { opacity:0, y:14, scale:.92, color:'#EEF5EF' }, { opacity:1, y:0, scale:1, duration:.45, ease:'expo.out' }, .02);
  tl.fromTo(NUM, { v:CONFIG.from }, { v:CONFIG.to, duration:COUNT.dur, ease:'power2.out',
    onUpdate:function(){ amountEl.textContent = money(NUM.v); } }, COUNT.start);
  var F = COUNT.start + COUNT.dur;   /* the new limit lands — and so does the last coin */
  KICK_T = F;
  /* anticipation: a tiny squeeze just before it lands */
  tl.to(amountEl, { scale:.94, duration:.08, ease:'power2.in' }, F - .08);
  /* punch: big, blue, then an elastic settle */
  tl.to(amountEl, { scale:1.3, color:'#3FA0F0', duration:.11, ease:'power3.out' }, F);
  tl.to(amountEl, { scale:1, duration:.6, ease:'elastic.out(1.15,0.42)' }, F + .11);
  tl.to(amountEl, { color:'#EEF5EF', duration:.6, ease:'power1.inOut' }, F + .55);
  /* burst: rings, rays and sparkles thrown out from the number */
  burst(tl, F);
  /* the whole scene takes the hit */
  tl.to(['#hero', '#art'], { keyframes:{ x:[0, -7, 6, -4, 3, -1, 0], y:[0, 4, -3, 2, -1, 0, 0] }, duration:.34, ease:'none' }, F);
  tl.fromTo('#up', { scale:.3, opacity:0 }, { scale:1, opacity:1, duration:.36, ease:'back.out(2.6)' }, F + .05);
  tl.fromTo('#was', { x:-8, opacity:0 }, { x:0, opacity:1, duration:.26, ease:'power2.out' }, F + .1);
  tl.fromTo('#exp', { y:8, opacity:0 }, { y:0, opacity:1, duration:.3, ease:'power3.out' }, F + .16);
  tl.fromTo('#starC', { scale:0, rotation:0, svgOrigin:'118 420' }, { scale:1, rotation:90, duration:.35, ease:'back.out(3)' }, F + .04);
  tl.fromTo('#starW', { scale:1, svgOrigin:'600 330' }, { scale:1.35, duration:.12, ease:'power2.out', yoyo:true, repeat:1 }, F + .02);

  /* coins and the shadows they cast appear together */
  tl.fromTo('#coinsBack', { opacity:0 }, { opacity:1, duration:.15 }, .18);
  tl.fromTo(['#coinsFront'], { opacity:0 }, { opacity:1, duration:.15 }, .24);
  tl.fromTo('#starW', { scale:0, rotation:-90, svgOrigin:'600 330' }, { scale:1, rotation:0, duration:.4, ease:'back.out(2.4)' }, .4);
  tl.fromTo('#starS1', { scale:0, rotation:-90, svgOrigin:'430 300' }, { scale:1, rotation:0, duration:.35, ease:'back.out(2.6)' }, .7);
  tl.fromTo('#starS2', { scale:0, rotation:-90, svgOrigin:'268 352' }, { scale:1, rotation:0, duration:.35, ease:'back.out(2.6)' }, 1.0);
  tl.add(twinkle, .8);

  var END = F + 1.1;   /* long enough for the kicked coins to land */
  tl.add(function(){ emit('landed'); }, F);
  tl.add(function(){ replay.classList.add('on'); emit('done'); }, END - .2);
  tl.to({}, { duration:.01 }, END);
  gsap.set(['#up', '#was', '#exp'], { opacity:0 });
  frame();
  return tl;
}
function start(){
  replay.classList.remove('on');
  build();
  if (reduce) { tl.progress(1); return; }
  tl.play(0);
}
var booted = false, pending = null;
function boot(){
  booted = true;
  setupCoins();
  fit(); applyData();
  addEventListener('resize', function(){ fit(); fitAmount(); });
  replay.addEventListener('click', start);
  var T = parseFloat(Q.get('t'));
  if (!isNaN(T)) { build(); tl.seek(T, false); window.__seek = function(x){ tl.seek(x, false); return tl.duration(); }; return; }
  if (pending) { var p = pending; pending = null; window.PeraCreditLimit.play(p); return; }
  if (window.CREDIT_LIMIT_AUTOPLAY !== false) setTimeout(start, 250);
}
/* public API for the host page / app */
window.PeraCreditLimit = {
  /* play (or replay) with backend data; options.onLanded / options.onDone are optional callbacks */
  play:function(data, options){
    if (!booted) { pending = data; HOOKS = options || HOOKS; return; }
    if (options) HOOKS = options;
    CONFIG = normalize(data || CONFIG);
    applyData(); start();
  },
  replay:function(){ if (booted) start(); },
  duration:3.4,
  getData:function(){ return Object.assign({}, CONFIG); }
};
window.__tl = function(){ return tl; };
(document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(boot);
})();
