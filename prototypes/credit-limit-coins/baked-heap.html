/* Responsive phone page in normal flow. --u = screen width / 360 (capped at 480px wide), set from JS,
   so type and pills scale with the phone; the coin artwork is an SVG that scales with its width. */
:root{ --bg:#0D1620; --text:#EEF5EF; --muted:#9AA7B0; --accent:#3FA0F0; --chip:#1B2834; --ink:#0D1620; --u:1; color-scheme:dark }
html,body{margin:0;background:var(--bg);-webkit-tap-highlight-color:transparent}
body{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;overflow-x:hidden;
  font-family:"PS Hanken",system-ui,sans-serif;touch-action:manipulation}
main{box-sizing:border-box;width:100%;max-width:480px;flex:1;display:flex;flex-direction:column;align-items:center;
  padding-top:calc(env(safe-area-inset-top,0px) + 24px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 24px);
  padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
.space-top{flex:.85 1 0;min-height:16px}
.space-mid{flex:1 1 0;min-height:calc(28px * var(--u))}
#hero{position:relative;display:flex;flex-direction:column;align-items:center;color:var(--text);text-align:center}
#burst{position:absolute;left:50%;top:calc(60px * var(--u));overflow:visible;pointer-events:none;transform:scale(var(--u))}
#label{font-weight:500;font-size:calc(14px * var(--u));line-height:1.43;color:var(--muted)}
#amount{margin-top:calc(6px * var(--u));font-family:"PS Num","PS Hanken",sans-serif;font-weight:700;font-size:calc(64px * var(--u));line-height:1.06;
  letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap;transform-origin:50% 60%}
#delta{display:flex;gap:calc(10px * var(--u));align-items:center;margin-top:calc(12px * var(--u));min-height:calc(30px * var(--u))}
#up{font-family:"PS Num","PS Hanken",sans-serif;padding:calc(5px * var(--u)) calc(12px * var(--u));border-radius:999px;background:var(--accent);color:var(--ink);
  font-weight:700;font-size:calc(15px * var(--u));line-height:1.33;font-variant-numeric:tabular-nums}
#was{font-family:"PS Num","PS Hanken",sans-serif;font-weight:500;font-size:calc(15px * var(--u));line-height:1.33;color:var(--muted);text-decoration:line-through;font-variant-numeric:tabular-nums}
#exp{font-family:"PS Num","PS Hanken",sans-serif;display:inline-flex;align-items:center;gap:calc(7px * var(--u));margin-top:calc(14px * var(--u));
  padding:calc(7px * var(--u)) calc(14px * var(--u)) calc(7px * var(--u)) calc(11px * var(--u));border-radius:999px;background:var(--chip);color:var(--text);
  font-weight:500;font-size:calc(13px * var(--u));line-height:1.38}
#exp svg{flex:none;width:calc(14px * var(--u));height:calc(14px * var(--u))}
/* the coins: full width, but never taller than about 40% of the screen on short phones */
#art{display:grid;width:100%}
#art>svg{grid-area:1/1;align-self:start;display:block;width:100%;height:auto;max-height:42vh;max-height:42dvh;overflow:visible}
/* the stars loop forever: their own compositing layer, so the coins are not repainted with them */
#artStars{will-change:transform}
/* the coin rows are drawn on canvases sized and placed from script over the star layer's box; their margins
   cancel their size so they never change the layout */
#art>canvas{grid-area:1/1;align-self:start;justify-self:start;display:block;width:0;height:0;pointer-events:none}
#replay{margin-top:calc(8px * var(--u));border:0;border-radius:999px;padding:calc(10px * var(--u)) calc(18px * var(--u));background:var(--chip);color:var(--text);
  font:600 calc(14px * var(--u))/1.43 "PS Hanken",system-ui,sans-serif;opacity:0;pointer-events:none;cursor:pointer;touch-action:manipulation}
#replay.on{opacity:1;pointer-events:auto}
#replay:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
</style>

var VIEW = null;
function layoutCanvas(){

function flat(pts){ var o = new Array(pts.length * 2); for (var i = 0; i < pts.length; i++) { o[2 * i] = pts[i][0]; o[2 * i + 1] = pts[i][1]; } return o; }
function poseAt(t){
  var F = BAKED.frames, f = Math.max(0, Math.min(F.length - 1.0001, t * BAKED.fps)), i0 = Math.floor(f), k = f - i0;

    var c = coins[i], p = A[i], q = B[i];

/* projection of a point onto a horizontal plane at height yP (the top face of a coin below), along the light */
function projectH(x, y, yP){

function worldOutline(c){

}
function bbox(pts){

/* a box that holds o's shadow on the horizontal plane yP. projectH moves a point right by (yP-y)*LX/LY and maps y

/* o casts onto c's top face: above it, close enough to matter */
function castsTop(o, c){ return o !== c && o.on && o.y < c.y - 4 && c.y - o.y <= 220 && Math.abs(o.x - c.x) <= 2 * RX + 60; }

/* paint order: lower coins first, higher ones on top */
function byHeight(p, q){ return (q.on ? q.y : 1e9) - (p.on ? p.y : 1e9); }

function render(t){

  var mFront = [], mBack = [];

    var c = coins[i];
    c.moved = c.on !== c.wasOn || (c.on && (c.x !== c.px || c.y !== c.py || c.a !== c.pa));
    if (!c.moved) continue;

    c.px = c.x; c.py = c.y; c.pa = c.a; c.cast = null; c.ver++;

  /* 2. shadows on top faces, from coins above in the same row — only where a caster or the receiver moved */
  [[front, mFront], [back, mBack]].forEach(function(L){
    var list = L[0], moved = L[1];
    if (!moved.length) return;
    list.forEach(function(c){
      if (!c.on || !touched(c, moved, castsTop, c.topFrom)) return;
      var from = [], top = [];
      if (tilt(c.a) <= FACE_TILT) {
        var yP = c.y - H / 2;
        list.forEach(function(o){
          if (!castsTop(o, c) || !overlap(shadowBoxH(o.bb, yP), c.face)) return;
          from.push(o);

          var k = c.pieces.get(o);

/* ---------- the burst around the number (flat: ring, rays, sparkles) ----------
   One staggered tween per group instead of one tween per element. */
function burst(tl, at){
  var b = $('burst'); b.innerHTML = '';
  var BLUE = '#3FA0F0', WHITE = '#EEF5EF';
  /* two thin rings, hugging the amount's shape, one just after the other */
  var RINGS = [[3.5, BLUE], [2, WHITE]];
  var rings = RINGS.map(function(r){ return el('ellipse', { cx:0, cy:0, rx:150, ry:48, fill:'none', stroke:r[1] }, b); });
  /* short rays from the rim, alternating blue and white */
  var n = 12, RAYS = [], rays = [];

    var a = (i + .5) / n * Math.PI * 2;

  tl.fromTo(rays, { opacity:1, attr:{ x1:function(i){ return RAYS[i].c * 158; }, y1:function(i){ return RAYS[i].s * 54; },

/* ---------- stars behind the coins keep twinkling: breathe in scale, tilt a little, each on its own beat ----------
   They loop forever, so they are paused while the page is hidden and never started with reduced motion. */
var twinkles = [];
function stopTwinkles(){ twinkles.forEach(function(t){ t.kill(); }); twinkles = []; gsap.set('.tw', { scale:1, rotation:0 }); }
function twinkle(){
  twinkles.forEach(function(t){ t.kill(); }); twinkles = [];

    var t = gsap.timeline({ repeat:-1, delay:i * .17, defaults:{ ease:'sine.inOut', svgOrigin:o } });

     .to(g, { scale:1.08, rotation:-6, duration:d * .35 })

/* ---------- timeline ---------- */
var tl = null, NUM = { v:0 }, fresh = false;

function build(){
  if (tl) tl.kill();

  tl = gsap.timeline({ paused:true, onUpdate:frame, defaults:{ ease:'power2.out' } });

  tl.fromTo(amountEl, { opacity:0, y:14, scale:.92, color:'#EEF5EF' }, { opacity:1, y:0, scale:1, duration:.45, ease:'expo.out' }, .02);

}
/* reduced motion: no timeline, no twinkling — draw the last baked frame and the final text straight away */
function showFinal(){
  if (tl) { tl.kill(); tl = null; }
  stopTwinkles();
  $('burst').innerHTML = '';
  gsap.set(['#label', '#amount', '#up', '#was', '#exp'], { opacity:1, x:0, y:0, scale:1 });
  gsap.set(amountEl, { color:'#EEF5EF' });
  gsap.set(['#hero', '#art'], { x:0, y:0 });
  gsap.set(['#cvBack', '#cvFront'], { opacity:1 });
  gsap.set(['#starW', '#starS1', '#starS2', '#starC'], { scale:1, rotation:0 });
  setAmount(money(CONFIG.to));
  render(BAKED.end); paint(false);

/* before anything plays (or while waiting for play(data)): the page shows the first frame, not the sample's end state */
function prepare(){
  if (reduce) { gsap.set(['#label', '#amount', '#up', '#was', '#exp', '#cvBack', '#cvFront'], { opacity:0 }); return; }
  build();
}
var started = false;
function start(){
  started = true;
  replay.classList.remove('on');
  if (reduce) { showFinal(); return; }
  if (!tl || !fresh) build();
  fresh = false;
  tl.play(0);
}

/* reduced motion via gsap.matchMedia(): follows the phone setting live (?motion forces the animation) */
var reduce = false, booted = false, pending = null;
var mm = gsap.matchMedia();
mm.add({ reduce:'(prefers-reduced-motion: reduce)', full:'(prefers-reduced-motion: no-preference)' }, function(ctx){
  reduce = !!ctx.conditions.reduce && !Q.has('motion');
  if (booted && started) start();           /* the setting changed while this screen is open */
});

/* start straight away: nothing here needs the fonts. When they are ready the amount is re-measured. */
function boot(){
  booted = true;
  setupCoins();
  fit(); applyData(); layoutCanvas();
  addEventListener('resize', onResize);
  /* the artwork's box also changes when the browser bars slide (its height is capped at 42% of the screen) */
  if (window.ResizeObserver) new ResizeObserver(function(){ layoutCanvas(); }).observe($('artStars'));
  replay.addEventListener('click', start);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ fitAmount(); });
  var T = parseFloat(Q.get('t'));
  if (!isNaN(T)) { build(); tl.seek(T, false); window.__seek = function(x){ tl.seek(x, false); return tl.duration(); }; return; }
  if (pending) { var p = pending; pending = null; window.PeraCreditLimit.play(p); return; }
  prepare();

/* public API for the host page / app */
window.PeraCreditLimit = {
  /* play (or replay) with backend data; options.onLanded / options.onDone are optional callbacks */
  play:function(data, options){

})();
