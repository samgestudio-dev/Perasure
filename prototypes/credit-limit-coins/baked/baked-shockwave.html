<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Credit limit coin heap + shockwave</title>
<meta name="description" content="PeraSure motion demo, Baked heap variant with a screen-distorting shockwave: when the amount lands, a glass-like bubble of compressed air grows out of it and refracts the whole screen.">
<!-- shared environment: the app's fonts and GSAP from the repo; this prototype's own files next to it -->
<!-- first paint: the dark background straight away (before the stylesheets arrive), and nothing of the scene until the
     animation has set its first frame (boot() adds .cl-on) -->
<style>html,body{background:#0D1620}html:not(.cl-on) #hero,html:not(.cl-on) #art{visibility:hidden}</style>
<link rel="preload" href="baked.json?v=202610280712" as="fetch" crossorigin>
<link rel="preload" href="../../../assets/fonts/satoshi-700.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="../../../assets/fonts/hanken-grotesk-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../../../assets/fonts/fonts.css">
<link rel="stylesheet" href="baked-heap.css?v=202610280712">
<!-- the shockwave filter bends <main> as one opaque picture -->
<style>main{background:var(--bg)}
/* ==== SHOCKWAVE TUNE PANEL (prototype only: delete these styles, the #tune markup and the panel script for production) ==== */
#tuneBtn{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:12px;z-index:5;border:0;border-radius:999px;padding:7px 12px;
  background:var(--chip);color:var(--text);font:600 13px/1.2 var(--ps-font-text);touch-action:manipulation}
#tune{position:fixed;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);z-index:7;max-height:62vh;overflow:auto;
  -webkit-overflow-scrolling:touch;background:#16212C;border:1px solid #26333F;border-radius:16px;padding:12px 14px 14px;color:var(--text);
  font:500 13px/1.3 var(--ps-font-text);display:none;box-shadow:0 10px 40px rgba(0,0,0,.45)}
#tune.on{display:block}
/* while a replay plays, the panel steps aside (still open; it comes back when the wave has passed) */
#tune.peek{visibility:hidden}
/* tap-outside catcher: no background (iOS tints its bars from coloured fixed layers), not displayed while closed */
#tuneCatch{position:fixed;inset:0;z-index:6;display:none}
#tuneCatch.on{display:block}
#tune .hd{display:flex;align-items:center;gap:6px;margin-bottom:8px;flex-wrap:wrap}
#tune .hd b{flex:1;font-weight:700;font-size:14px}
#tune button{border:0;border-radius:999px;padding:6px 11px;background:#26333F;color:var(--text);font-family:inherit;font-weight:600;font-size:12px;line-height:1.2;touch-action:manipulation}
#tune .row{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;margin:9px 0}
#tune .row span{color:var(--muted)}
#tune .row output{font-variant-numeric:tabular-nums;color:var(--text)}
#tune .row input[type=range]{grid-column:1 / span 2;width:100%;margin:2px 0 0;accent-color:var(--accent);touch-action:pan-y}
#tune .note{color:var(--muted);font-size:12px;margin-top:6px}
/* ==== END SHOCKWAVE TUNE PANEL ==== */
</style>
</head>
<body>
<main>
  <div class="space-top"></div>
  <div id="hero" aria-live="polite">

    <div id="amount">₱45,000</div>
    <svg id="burst" width="1" height="1" aria-hidden="true"></svg>
    <div id="delta"><span id="up">+₱5,000</span><span id="was">₱45,000</span></div>
    <div id="exp">
      <span class="ic" aria-hidden="true"><span class="ic-glyph"><span class="ic-bleed"><svg aria-hidden="true" preserveAspectRatio="none" overflow="visible" style="display: block;" width="32.9678" height="32.9678" viewBox="0 0 32.9678 32.9678" fill="none" xmlns="http://www.w3.org/2000/svg">
<g id="Pending">
<path id="Vector" d="M16.4839 31.4695C24.7628 31.4695 31.4839 24.7483 31.4839 16.4695C31.4839 8.19066 24.7628 1.48392 16.4839 1.48392C8.20508 1.48392 1.48392 8.19065 1.48392 16.4839C1.48392 24.7772 8.20508 31.4839 16.4839 31.4839V31.4695Z" stroke-width="2.96785" stroke-linecap="round" stroke-linejoin="round" stroke="black"/>
<g id="Group">

</g>
</g>
</svg></span></span></span>
      <span id="expText">Valid until Nov 30 2026</span>
    </div>
  </div>

  <div class="space-mid"></div>
  <!-- artwork in its own units; coins fall in from above the box (overflow visible).
       Layers stacked in one grid cell: the twinkling stars (SVG) at the back, then the coins behind and in front (canvases). -->
  <div id="art" aria-hidden="true">
    <svg id="artStars" viewBox="0 236 726 485" aria-hidden="true">
      <g class="tw" data-o="600 330" data-d="1.1"><path id="starW" d="M600 286 C603.96 318.12 611.88 326.04 644 330 611.88 333.96 603.96 341.88 600 374 596.04 341.88 588.12 333.96 556 330 588.12 326.04 596.04 318.12 600 286 Z" fill="#EEF5EF"/></g>
      <g class="tw" data-o="430 300" data-d=".8"><path id="starS1" d="M430 285 C431.35 295.95 434.05 298.65 445 300 434.05 301.35 431.35 304.05 430 315 428.65 304.05 425.95 301.35 415 300 425.95 298.65 428.65 295.95 430 285 Z" fill="#EEF5EF"/></g>
      <g class="tw" data-o="268 352" data-d=".95"><path id="starS2" d="M268 341 C268.99 349.03 270.97 351.01 279 352 270.97 352.99 268.99 354.97 268 363 267.01 354.97 265.03 352.99 257 352 265.03 351.01 267.01 349.03 268 341 Z" fill="#3FA0F0"/></g>
      <g class="tw" data-o="118 420" data-d=".9"><path id="starC" d="M118 396 C120.16 413.52 124.48 417.84 142 420 124.48 422.16 120.16 426.48 118 444 115.84 426.48 111.52 422.16 94 420 111.52 417.84 115.84 413.52 118 396 Z" fill="#FF6B3D"/></g>
    </svg>
    <canvas id="cvBack"></canvas>
    <canvas id="cvFront"></canvas>
  </div>
  <button id="replay" type="button">Replay</button>
</main>

<!-- ==== SHOCKWAVE TUNE PANEL (prototype only: delete for production) ==== -->
<button id="tuneBtn" type="button">Tune</button>
<div id="tuneCatch"></div>
<div id="tune" role="dialog" aria-label="Shockwave">
  <div class="hd"><b>Shockwave</b><button id="tuneReplay" type="button">Replay</button><button id="tuneReset" type="button">Reset</button><button id="tuneCopy" type="button">Copy</button><button id="tuneClose" type="button">Close</button></div>
  <div id="tuneRows"></div>
  <div class="note">Releasing a slider replays with the new values; the panel steps aside until the wave has passed. A dot marks a value that differs from the default. The values are kept on this phone.</div>
</div>
<!-- ==== END SHOCKWAVE TUNE PANEL ==== -->

<script src="../../../vendor/gsap@3.15.0/gsap.min.js"></script>
