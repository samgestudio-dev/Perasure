<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body { background: #fff; color: #0b1220; font-family: var(--ps-font-text); -webkit-font-smoothing: antialiased; }
  button { font: inherit; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  #root { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px;
          padding: env(safe-area-inset-top) 16px calc(env(safe-area-inset-bottom) + 24px); }
  .amount { font-family: var(--ps-font-num); font-weight: 700; font-size: 44px; letter-spacing: -0.02em; }

<body>
<div id="root"></div>
<script>
(function(){
  'use strict';
  var h = React.createElement, M = Motion, m = M.m;
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  function App(){
    var ref = React.useRef(null), st = React.useState(0), n = st[0], setN = st[1];
    /* GSAP: count the amount up (written straight to the element, not through React state) */
    React.useEffect(function(){
      var o = { v: 0 }, el = ref.current;
      var tw = gsap.to(o, { v: 50000, duration: reduce ? 0 : 1.2, ease: 'power3.out',
        onUpdate: function(){ el.textContent = '₱' + Math.round(o.v).toLocaleString('en-US'); } });
      return function(){ tw.kill(); };
    }, [n]);
    /* Motion: spring press and entrance */
    return h(M.LazyMotion, { features: M.domAnimation, strict: true },
      h(m.div, { key: n, className: 'amount', ref: ref, initial: reduce ? false : { opacity: 0, y: 10 }, animate: { opacity: 1, y: 0 },
                 transition: { type: 'spring', visualDuration: .4, bounce: .2 } }, '₱0'),
      h(m.button, { className: 'btn', whileTap: { scale: .96 }, onClick: function(){ setN(n + 1); } }, 'Replay'));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(App));
})();
</script>
