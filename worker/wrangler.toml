# PeraSure Playground on samge.studio (worker/README.md). Deployed by .github/workflows/devmode-live.yml; by hand: npx wrangler deploy -c worker/wrangler.toml
name = "perasure-devmode"
main = "index.js"
compatibility_date = "2025-09-01"
workers_dev = false
# keep the switches SITE_LOGIN / MCP_LOGIN set in the Cloudflare dashboard (they are not written here)
keep_vars = true
routes = [{ pattern = "samge.studio/*", zone_name = "samge.studio" }]
# Secrets (never here): GITHUB_TOKEN, DEVMODE_USER, DEVMODE_PASS, SESSION_SECRET, MCP_TOKEN

[vars]
# public site key of the Cloudflare Turnstile widget "perasure-devmode-login" (its secret is the TURNSTILE_SECRET secret)
TURNSTILE_SITEKEY = "0x4AAAAAAGAkWmfYJfGFH4Y_"
