   by lottie-web (SVG renderer) and a GSAP module (inline SVG + one timeline). The Lottie / GSAP
   switch picks the renderer; both are driven through the same small "engine" interface, so the
   playback rules (intro once → loop, one-shot holds, coin loading → success), the scrubber,
   speed and replay behave identically. Switching renderer keeps the current frame.
   ?a=<slug> picks the animation, ?r=gsap the renderer; menu, stepper, swipe and ←/→ switch it.

   React / Material UI view (assets/playground-ui.js theme). The view subscribes to the

(function(){

  var LOAD_TOKEN = Date.now().toString(36);   // fresh GSAP modules per page load (bypasses stale caches)

        })));
  }

  /* ---------- stage ---------- */
  function Stage(p){
    var st = p.st, entry = p.entry;
    var refA = R.useRef(null), refB = R.useRef(null), sw = R.useRef(null);
    R.useEffect(function(){

      st.loading ? h(M.Box, { sx: { position: 'absolute', inset: 0, display: 'grid', placeItems: 'center' } },
        h(M.CircularProgress, { size: 28, thickness: 4 })) : null,
      st.error ? h(M.Box, { sx: { position: 'absolute', inset: 0, display: 'grid', placeItems: 'center', p: 3, textAlign: 'center' } },
        h(M.Typography, { variant: 'body2', color: 'text.secondary' }, st.error)) : null,
      h(RendererSwitch, { st: st, entry: entry }),
      h(BgSwatches, { st: st }),
      h(StageAction, { st: st }));
  }

  /* Interactive animations (coin loading → success) get their trigger inside the stage,
     bottom-right, as a small pill — it acts on what you're looking at. */
  function StageAction(p){
    var st = p.st;
    if (st.success === 'none' || st.loading) return null;
    var waiting = st.success === 'waiting', done = st.success === 'done', dark = st.bg === 'dark';
    var quiet = dark
      ? { bgcolor: 'rgba(36,46,53,0.9)', color: '#fff', borderColor: 'rgba(255,255,255,0.14)', boxShadow: '0 2px 10px rgba(0,0,0,0.35)' }

    return h(M.Button, {

      onPointerDown: function(e){ e.stopPropagation(); },

      sx: { position: 'absolute', right: 12, bottom: 12, minHeight: 32, height: 32, px: 1.5, borderRadius: 99, fontSize: 13,

  function Pager(p){
    var navSx = { width: 40, height: 40, bgcolor: '#fff', boxShadow: PG.theme.shadows[2], '&:hover': { bgcolor: '#fff' } };
    return h(M.MobileStepper, {

      sx: { bgcolor: 'transparent', px: 0, mt: 1.5,
        '& .MuiMobileStepper-dot': { width: 6, height: 6, mx: '3px', bgcolor: '#c9d1d5', transition: PG.reduce ? 'none' : 'width .2s ease' },
        '& .MuiMobileStepper-dotActive': { width: 18, borderRadius: 3, bgcolor: 'primary.main' } }
    });
  }

  /* ---------- playback card ---------- */
  /* Timeline: a plain bar, not a React-controlled slider. Every rendered frame writes the thumb
     position and the frame number straight to the DOM — no transitions, no easing, no React
     re-render — so the dot is always exactly at the current time and jumps instantly when the
     loop restarts. Drag (or ←/→ when focused) scrubs. */
  var SEG_PILL = 70;
  function Timeline(p){
    var st = p.st, entry = p.entry;
    var bar = R.useRef(null), thumb = R.useRef(null), num = R.useRef(null), drag = R.useRef(null);
    var total = st.total || 0;
    function paintSeg(f){
      if (!segs || !ind.current) return;
      var s2 = ctl.getState();
      var n = entry.success ? (s2.success === 'done' ? 1 : 0) : (f < entry.intro[1] - 0.001 ? 0 : 1);
      ind.current.style.transform = 'translateX(' + (n * SEG_PILL) + 'px)';
      ind.current.style.backgroundColor = s2.paused ? '#8e989e' : C.blue;
      if (n !== lastSeg.current) {

      }

    function paint(f){
      paintSeg(f);
      var t = st.total || 0, x = t ? Math.max(0, Math.min(1, f / t)) : 0;
      if (thumb.current) thumb.current.style.left = (x * 100) + '%';

      if (bar.current) bar.current.setAttribute('aria-valuenow', String(Math.round(f)));
    }

      lastSeg.current = -1;
      paint(ctl.getFrame());

    }, [st.total, st.paused, st.success, entry.slug]);
    function frameAt(clientX){
      var r = bar.current.getBoundingClientRect();
      return Math.max(0, Math.min(1, (clientX - r.left) / r.width)) * (st.total || 0);
    }
    var hasRegions = entry.intro && entry.loop && st.success === 'none' && total;
    var cut = hasRegions ? (entry.intro[1] / total * 100) + '%' : null;
    var rail = hasRegions
      ? 'linear-gradient(90deg,' + C.blue200 + ' 0,' + C.blue200 + ' ' + cut + ',' + C.blue + ' ' + cut + ',' + C.blue + ' 100%)'
      : C.blue100;

    var key = st.paused ? ((st.phase === 'once' || st.phase === 'success') && total && f0 >= total - 1 ? 'done' : 'paused') : st.phase;

              icon: h(M.Box, { component: 'span', sx: { width: 8, height: 8, borderRadius: 99, bgcolor: ph.dot, ml: '8px !important' } }),
              sx: { bgcolor: C.soft, color: 'text.primary', height: 26, fontSize: 12, border: '1px solid ' + C.line } }),
        h(M.Typography, { variant: 'caption', color: 'text.secondary', sx: { fontVariantNumeric: 'tabular-nums' } },

        style: { position: 'relative', height: 36, marginTop: 4, touchAction: 'none', cursor: 'pointer', outline: 'none',

      },
        h('div', { style: { position: 'absolute', left: 0, right: 0, top: 15, height: 6, borderRadius: 3, background: rail } }),
        cut ? h('div', { style: { position: 'absolute', left: cut, top: 13, width: 2, height: 10, marginLeft: -1, borderRadius: 1, background: '#fff' } }) : null,
        h('div', { ref: thumb, style: { position: 'absolute', top: 7, left: '0%', width: 22, height: 22, marginLeft: -11, borderRadius: 11,

  function PlaybackCard(p){
    var st = p.st, entry = p.entry;
    return h(SectionCard, { sx: { mt: 2 } },

  function DetailsCard(p){
    var st = p.st, e = p.entry, m = st.meta, base = e.slug + '/', gs = st.renderer === 'gsap' && e.gsap;
    function row(k, v){
      return h(M.Stack, { key: k, direction: 'row', justifyContent: 'space-between', spacing: 2, sx: { py: 0.75 } },
        h(M.Typography, { variant: 'body2', color: 'text.secondary' }, k),
        h(M.Typography, { variant: 'body2', sx: { fontWeight: 500, textAlign: 'right' } }, v));
    }
    var playback = e.success ? 'Loading loops → success once' : e.intro ? 'Intro ' + e.intro[0] + '–' + e.intro[1] + ' → loop ' + e.loop[0] + '–' + e.loop[1] : 'Plays once, holds the last frame';
    var files = gs ? [e.gsap].concat(e.gsapSuccess ? [e.gsapSuccess] : []) : [e.json].concat(e.success ? [e.success] : [], e.lottie ? [e.lottie] : []);
    return h(SectionCard, { title: 'Details' },
      h(M.Box, { sx: { '& > * + *': { borderTop: '1px solid ' + C.line } } },
        row('Canvas', m ? m.w + ' × ' + m.h : '—'),
        row('Frame rate', m ? (Math.round(m.fps * 100) / 100) + ' fps' : '—'),
        row('Renderer', m ? m.label : '—'),
        row('Playback', playback)),
      h(M.Typography, { variant: 'caption', color: 'text.secondary', sx: { display: 'block', mt: 1.5, mb: 1 } }, 'Files'),
      h(M.Stack, { direction: 'row', useFlexGap: true, flexWrap: 'wrap', spacing: 1 },
        files.map(function(f){
          return h(M.Chip, { key: f, component: 'a', href: base + f, download: true, clickable: true, variant: 'outlined',
            icon: h(Icon.download, { sx: { fontSize: 16 } }), label: f.split('/').pop(),
            sx: { height: 30, borderRadius: '10px', fontWeight: 500, color: 'text.primary', borderColor: C.line, '& .MuiChip-icon': { color: 'primary.main' } } });
        })));
  }

  /* Header stays pinned to the top. Transparent at the top of the page; once the page scrolls it
     takes the plain page colour (same as the index tabs), covering the status-bar area too. */
  function StickyHeader(p){
    var s = R.useState(false), scrolled = s[0], setScrolled = s[1];
    R.useEffect(function(){
      var on = false, raf = 0;

    return h(M.Box, { component: 'header', sx: {
        position: 'sticky', top: 0, zIndex: 10, mx: -2, px: 2,
        pt: 'calc(env(safe-area-inset-top, 0px) + 8px)', pb: 1,
        bgcolor: scrolled ? C.page : 'transparent' } }, p.children);
  }

  /* ---------- app ---------- */
  function App(){
    var st = useCtl(), entry = LIST[st.index] || LIST[0];
    R.useEffect(function(){
      function onKey(e){
        if (document.querySelector('.MuiMenu-paper') || (e.target && e.target.getAttribute && e.target.getAttribute('role') === 'slider')) return;
        if (e.key === 'ArrowRight') ctl.go(1);
        else if (e.key === 'ArrowLeft') ctl.go(-1);
        else if (e.key === ' ' && !(e.target && /^(BUTTON|A|INPUT)$/.test(e.target.tagName))) { e.preventDefault(); ctl.togglePlay(); }
      }
      var hid = false;
      function onVis(){ if (document.hidden) hid = ctl.pauseHidden(); else if (hid) { hid = false; ctl.resumeHidden(); } }
      document.addEventListener('keydown', onKey);
      document.addEventListener('visibilitychange', onVis);
      return function(){ document.removeEventListener('keydown', onKey); document.removeEventListener('visibilitychange', onVis); };
    }, []);
    if (!entry) return h(M.Typography, { sx: { p: 3 } }, 'No animations registered.');
    return h(M.Container, { disableGutters: true, sx: {
        maxWidth: 480, px: 2, pb: 'calc(env(safe-area-inset-bottom, 0px) + 32px)' } },
      h(StickyHeader, null, h(TopBar, { st: st })),
      h(M.Box, { sx: { textAlign: 'center', mt: 1 } },
        h(M.Typography, { variant: 'h5', component: 'h1' }, entry.title),
        h(M.Typography, { variant: 'body2', color: 'text.secondary', sx: { mt: 0.75, mx: 'auto', maxWidth: 360, minHeight: 40 } }, entry.desc)),
      h(Stage, { st: st, entry: entry }),
      h(Pager, { st: st }),
      h(PlaybackCard, { st: st, entry: entry }),
      h(DetailsCard, { st: st, entry: entry }));
  }

  /* boot */
  var rq = (/[?&]r=(lottie|gsap)\b/.exec(location.search) || [])[1];
  renderer = rq || store('ps-lottie-renderer') || 'lottie';
  if (!window.lottie) { document.getElementById('root').textContent = 'Player library failed to load.'; return; }
  PG.mount(document.getElementById('root'), App);
})();
