<script>
/* ---- Animation player ------------------------------------------------------------------
   One animation at a time. Each animation exists twice, pixel-matched: the Lottie JSON played
   by lottie-web (SVG renderer) and a GSAP module (inline SVG + one timeline). The Lottie / GSAP
   switch picks the renderer; both are driven through the same small "engine" interface, so the
   playback rules (intro once → loop, one-shot holds, coin loading → success), the scrubber,
   speed and replay behave identically. Switching renderer keeps the current frame.
   ?a=<slug> picks the animation, ?r=gsap the renderer; menu, stepper, swipe and ←/→ switch it.

   Structure: engines (renderer adapters) → controller (playback rules + state, no UI) →
   React / Material UI view (assets/playground-ui.js theme). The view subscribes to the
   controller's state; the frame counter + slider subscribe to a separate per-frame store so
   the rest of the page does not re-render while playing. */
(function(){
  var M = MaterialUI, R = React, h = PG.h, Icon = PG.Icon, C = PG.C;
  var LIST = window.LOTTIES || [];
  var SPEEDS = [1, 0.5, 0.25, 2];
  var renderer = 'lottie';             // 'lottie' | 'gsap' — read by engineFor()

  function store(k, v){ try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
  function noop(){}

  /* ---------- engines ----------------------------------------------------------------
     ready (Promise) · total · fps · w · h · label · frame() · seek(f) · play(a, b, done)
     loop(a, b) · finish(done): end the current pass, then done · pause() · resume()
     setSpeed(s) · destroy() · onFrame (callback, set by the player) */
  function lottieEngine(box, path){
    var e = { onFrame: noop, label: 'lottie-web ' + (lottie.version || '') + ' · SVG' }, done = null;
    var a = lottie.loadAnimation({
      container: box, renderer: 'svg', loop: false, autoplay: false, path: path,
      rendererSettings: { preserveAspectRatio: 'xMidYMid meet', progressiveLoad: false, hideOnTransparent: true }
    });
    e.ready = new Promise(function(res, rej){
      a.addEventListener('DOMLoaded', function(){
        var d = a.animationData; e.total = d.op - d.ip; e.fps = d.fr; e.w = d.w; e.h = d.h; res(e);
      });
      a.addEventListener('data_failed', function(){ rej(new Error('Couldn’t load ' + path)); });
    });
    a.addEventListener('enterFrame', function(){ e.onFrame(); });
    a.addEventListener('complete', function(){ var d = done; done = null; if (d) d(); });
    e.frame = function(){ return a.firstFrame + a.currentFrame; };
    e.seek = function(f){ done = null; a.loop = false; a.resetSegments(true); a.goToAndStop(f, true); e.onFrame(); };
    e.play = function(s, t, cb){ done = cb || null; a.loop = false; a.playSegments([s, t], true); };
    e.loop = function(s, t){ done = null; a.loop = true; a.playSegments([s, t], true); };
    e.finish = function(cb){ done = cb; a.loop = false; if (a.isPaused) a.play(); };
    e.pause = function(){ a.pause(); };
    e.resume = function(){ a.play(); };
    e.setSpeed = function(s){ a.setSpeed(s); };
    e.destroy = function(){ done = null; a.destroy(); };

  }

  function gsapEngine(box, url){
    var e = { onFrame: noop }, api = null, tl = null, F = 1, drv = null, end = 0, speed = 1, dead = false;

      kill(); end = t;
      vars.onUpdate = upd;
      drv = tl.tweenFromTo(s * F, t * F, vars);
      drv.timeScale(speed);
    }
    e.ready = Promise.all([import(url), import('gsap')]).then(function(r){

      e.label = 'GSAP ' + (g && g.version || '') + ' · inline SVG';
      return e;
    });

    e.seek = function(f){ kill(); tl.seek(f * F, false); e.onFrame(); };
    e.play = function(s, t, cb){ drive(s, t, { onComplete: function(){ drv = null; if (cb) cb(); } }); };
    e.loop = function(s, t){ drive(s, t, { repeat: -1 }); };
    e.finish = function(cb){
      var from = e.frame();
      if (end - from < 0.01) { kill(); if (cb) cb(); return; }
      drive(from, end, { onComplete: function(){ drv = null; if (cb) cb(); } });
    };
    e.pause = function(){ if (drv) drv.pause(); };
    e.resume = function(){ if (drv) drv.resume(); };
    e.setSpeed = function(s){ speed = s; if (drv) drv.timeScale(s); };
    e.destroy = function(){ dead = true; kill(); if (api) api.destroy(); };
    return e;
  }

  function hasGsap(entry){ return !!entry.gsap; }
  function engineFor(box, entry, part){
    var base = entry.slug + '/';
    if (renderer === 'gsap' && hasGsap(entry))
      return gsapEngine(box, './' + base + (part === 'success' ? entry.gsapSuccess : entry.gsap));

  }


  /* ---------- controller ------------------------------------------------------------- */
  var ctl = (function(){
    var st = {
      index: 0, renderer: 'lottie', paused: false, phase: 'intro', speedIx: 0,
      success: 'none', loading: true, error: '', total: 0, meta: null,
      bg: store('ps-lottie-bg') || 'white'

    var subs = [], fsubs = [], frame = 0;
    var cur = null, A = null, B = null, active = null, boxA = null, boxB = null, token = 0;

        paused: paused, phase: phase, total: active && active.total || 0,

    }
    function showBox(which){
      if (boxA) boxA.style.visibility = which === 'B' ? 'hidden' : 'visible';
      if (boxB) boxB.style.visibility = which === 'B' ? 'visible' : 'hidden';
    }
    function syncUrl(){
      try { history.replaceState(null, '', '?a=' + encodeURIComponent(cur.slug) + (renderer === 'gsap' ? '&r=gsap' : '') + location.hash); } catch (e) {}

      if (A) A.destroy(); if (B) B.destroy();

    // resume: { frame, paused } to continue where the other renderer was

      if (!boxA) return;

      phase = cur.success ? 'loading' : cur.intro ? 'intro' : 'once';
      set({ index: i, renderer: renderer, loading: true, error: '', total: 0, meta: null, paused: false, phase: phase,
            success: cur.success ? 'idle' : 'none' });
      syncUrl();

      A = engineFor(boxA, cur, 'main'); active = A;
      if (cur.success) B = engineFor(boxB, cur, 'success');
      [A, B].forEach(function(e){ if (e) { e.onFrame = function(){ if (active === e && my === token) tick(); }; e.setSpeed(SPEEDS[st.speedIx]); } });

        if (my !== token) return;

        if (B) B.seek(0);
        var f = resume ? Math.max(0, Math.min(resume.frame, A.total - 0.01)) : 0;
        if (resume && resume.paused) { A.seek(f); paused = true; sync(); }
        else start(f);

        if (my !== token) return;
        set({ loading: false, error: (err && err.message) || 'Couldn’t load the animation.' });

    }

    /* playback rules: intro once → loop forever; one-shots hold the last frame */
    function start(f){
      paused = false;
      if (cur.success) { coinPlay(f); return; }
      var end = A.total;
      if (cur.intro && f < cur.intro[1] - 0.5) { phase = 'intro'; A.play(f, cur.intro[1], enterLoop); }
      else if (cur.loop) {
        if (f > cur.loop[0] + 0.5 && f < cur.loop[1] - 0.5) { phase = 'tail'; A.play(f, cur.loop[1], enterLoop); }
        else { enterLoop(); return; }
      }
      else {
        if (f >= end - 0.5) f = 0;
        phase = 'once'; A.play(f, end, function(){ paused = true; sync(); });
      }
      sync();
    }
    function enterLoop(){ phase = 'loop'; A.loop(cur.loop[0], cur.loop[1]); sync(); }

    /* coin: loading loops until "Show success"; the loop finishes its turn, then success plays */
    function coinPlay(f){
      paused = false;
      if (active === A) {
        phase = 'loading';
        if (successReq) A.play(f, A.total, swapToSuccess);
        else if (f > 0.5 && f < A.total - 0.5) A.play(f, A.total, coinLoop);
        else { coinLoop(); return; }
      } else {
        phase = 'success';
        if (f >= B.total - 0.5) f = 0;
        B.play(f, B.total, function(){ paused = true; sync(); });
      }
      sync();
    }
    function coinLoop(){ A.loop(0, A.total); sync(); }
    function swapToSuccess(){
      showBox('B'); active = B; phase = 'success'; paused = false;
      B.play(0, B.total, function(){ paused = true; sync(); });
      sync();
    }
    function resetCoin(){
      successReq = false; B.seek(0); showBox('A'); active = A;
      start(0);
    }

    var api = {
      getState: function(){ return st; },
      subscribe: function(f){ subs.push(f); return function(){ subs = subs.filter(function(x){ return x !== f; }); }; },
      getFrame: function(){ return frame; },
      subscribeFrame: function(f){ fsubs.push(f); return function(){ fsubs = fsubs.filter(function(x){ return x !== f; }); }; },
      attach: function(a, b){ boxA = a; boxB = b; showBox('A'); },
      open: open,
      go: function(d){ open((st.index + d + LIST.length) % LIST.length); },
      setRenderer: function(r){
        if (!cur || r === renderer || (r === 'gsap' && !cur.gsap)) return;
        var resume = active && active.total && !cur.success ? { frame: active.frame(), paused: paused } : null;
        renderer = r; store('ps-lottie-renderer', r);
        open(st.index, resume);
      },
      togglePlay: function(){
        if (!active || !active.total) return;
        if (paused) { var f = active.frame(); if (cur.success) coinPlay(f); else start(f); }
        else { active.pause(); paused = true; sync(); }
      },
      replay: function(){
        if (!active || !active.total) return;
        if (cur.success) { if (active === B) resetCoin(); else { successReq = false; start(0); } return; }
        start(0);
      },
      showSuccess: function(){
        if (!B || !active || !active.total) return;
        if (active === B) { resetCoin(); return; }
        successReq = true; paused = false;
        A.finish(swapToSuccess);
        sync();
      },
      cycleSpeed: function(){
        var ix = (st.speedIx + 1) % SPEEDS.length;
        if (A) A.setSpeed(SPEEDS[ix]); if (B) B.setSpeed(SPEEDS[ix]);
        set({ speedIx: ix });
      },
      scrubMove: function(f){
        if (!active || !active.total) return;
        if (!scrubbing) { scrubbing = true; wasPlaying = !paused; active.pause(); paused = true; sync(); }
        active.seek(Math.max(0, Math.min(f, active.total - 0.01)));
        tick(f);
      },
      scrubEnd: function(f){
        if (!scrubbing) return;
        scrubbing = false;
        if (wasPlaying) { if (cur.success) coinPlay(f); else start(f); } else sync();
      },
      setBg: function(bg){ store('ps-lottie-bg', bg); set({ bg: bg }); },
      pauseHidden: function(){ if (active && !paused) { active.pause(); return true; } return false; },
      resumeHidden: function(){ if (active) active.resume(); }
    };
    return api;
  })();

  window.PSPlayer = ctl;   // for debugging: PSPlayer.getState(), PSPlayer.go(1) …

  /* ---------- view helpers ---------- */
  function useCtl(){ return R.useSyncExternalStore(ctl.subscribe, ctl.getState); }
  function useFrame(){ return R.useSyncExternalStore(ctl.subscribeFrame, ctl.getFrame); }

  var BG = {
    white: { label: 'White', css: { bgcolor: '#fff' } },
    page: { label: 'Page', css: { bgcolor: C.page } },
    dark: { label: 'Dark', css: { bgcolor: '#141e24' } },
    grid: { label: 'Transparency grid', short: 'Grid', css: { bgcolor: '#fff',
      backgroundImage: 'linear-gradient(45deg,#eef0f2 25%,transparent 25%,transparent 75%,#eef0f2 75%),linear-gradient(45deg,#eef0f2 25%,transparent 25%,transparent 75%,#eef0f2 75%)',
      backgroundSize: '20px 20px', backgroundPosition: '0 0,10px 10px' } }
  };
  var PHASE = {
    intro: { label: 'Intro', dot: '#7aa7d8' }, loop: { label: 'Loop', dot: C.blue }, tail: { label: 'Loop', dot: C.blue },
    once: { label: 'Playing', dot: C.blue }, loading: { label: 'Loading loop', dot: '#7aa7d8' }, success: { label: 'Success', dot: '#1a9b6b' },
    paused: { label: 'Paused', dot: '#a3abb0' }, done: { label: 'Done', dot: '#1a9b6b' }
  };

  function SectionCard(p){
    return h(M.Card, { sx: Object.assign({ p: 2, mt: 1.5 }, p.sx || {}) },
      p.title ? h(M.Typography, { variant: 'overline', color: 'text.secondary', sx: { display: 'block', mb: 1 } }, p.title) : null,
      p.children);
  }

  /* ---------- top bar + animation menu ---------- */
  function TopBar(p){
    var st = p.st;
    var a = R.useState(null), anchor = a[0], setAnchor = a[1];
    return h(M.Stack, { direction: 'row', alignItems: 'center', justifyContent: 'space-between', sx: { minHeight: 52 } },
      h(M.Button, { href: '../index.html#animations', size: 'large', startIcon: h(Icon.back, { sx: { fontSize: '28px !important' } }),
        'aria-label': 'Back to the Playground',
        sx: { ml: -1.25, pl: 0.75, pr: 1.5, fontSize: 17, lineHeight: '24px', letterSpacing: '-0.01em', '& .MuiButton-startIcon': { mr: 0.25 } } }, 'Playground'),
      h(M.Stack, { direction: 'row', spacing: 1 },
        h(M.IconButton, { 'aria-label': 'Background colour', 'aria-haspopup': 'dialog', onClick: p.onBg,
          sx: { width: 44, height: 44, bgcolor: '#fff', color: 'text.primary', boxShadow: PG.theme.shadows[2], '&:hover': { bgcolor: '#fff' } } },
          h(M.Box, { sx: Object.assign({ position: 'absolute', right: 7, bottom: 7, width: 12, height: 12, borderRadius: 99,
            boxShadow: '0 0 0 2px #fff, inset 0 0 0 1px ' + C.line }, BG[st.bg] ? BG[st.bg].css : {}, st.bg === 'grid' ? { backgroundSize: '6px 6px', backgroundPosition: '0 0,3px 3px' } : {}) }),

      variant: done ? 'outlined' : 'contained', size: 'small', disabled: waiting, onClick: ctl.showSuccess,
      onPointerDown: function(e){ e.stopPropagation(); },
      startIcon: waiting ? h(M.CircularProgress, { size: 12, thickness: 6, color: 'inherit' }) : h(done ? Icon.replay : Icon.done, { sx: { fontSize: '16px !important' } }),
      sx: { position: 'absolute', right: 12, bottom: 12, minHeight: 32, height: 32, px: 1.5, borderRadius: 99, fontSize: 13,
        boxShadow: done ? PG.theme.shadows[2] : '0 2px 8px rgba(44,116,190,0.35)', bgcolor: done ? '#fff' : undefined,
        '&.Mui-disabled': { bgcolor: '#fff', color: 'text.secondary', boxShadow: PG.theme.shadows[2] } }
    }, waiting ? 'Finishing…' : done ? 'Reset' : 'Show success');
  }

  function Pager(p){
    var navSx = { width: 40, height: 40, bgcolor: '#fff', boxShadow: PG.theme.shadows[2], '&:hover': { bgcolor: '#fff' } };
    return h(M.MobileStepper, {
      variant: LIST.length > 12 ? 'text' : 'dots', steps: LIST.length, activeStep: p.st.index, position: 'static',
      backButton: h(M.IconButton, { 'aria-label': 'Previous animation', onClick: function(){ ctl.go(-1); }, sx: navSx }, h(Icon.back, null)),
      nextButton: h(M.IconButton, { 'aria-label': 'Next animation', onClick: function(){ ctl.go(1); }, sx: navSx }, h(Icon.next, null)),
      sx: { bgcolor: 'transparent', px: 0, mt: 1.5,
        '& .MuiMobileStepper-dot': { width: 6, height: 6, mx: '3px', bgcolor: '#c9d1d5', transition: PG.reduce ? 'none' : 'width .2s ease' },
        '& .MuiMobileStepper-dotActive': { width: 18, borderRadius: 3, bgcolor: 'primary.main' } }
    });
  }

  /* ---------- playback card ---------- */
  function Timeline(p){
    var st = p.st, entry = p.entry, f = useFrame();
    var total = st.total || 1, v = Math.max(0, Math.min(f, total));
    var key = st.paused ? ((st.phase === 'once' || st.phase === 'success') && f >= total - 1 ? 'done' : 'paused') : st.phase;
    var ph = PHASE[key] || PHASE.paused;
    var rail = entry.intro && entry.loop && st.success === 'none'
      ? 'linear-gradient(90deg,' + C.blue200 + ' 0,' + C.blue200 + ' ' + (entry.intro[1] / total * 100) + '%,' + C.blue + ' ' + (entry.intro[1] / total * 100) + '%,' + C.blue + ' 100%)'
      : C.blue100;
    return h(R.Fragment, null,
      h(M.Stack, { direction: 'row', alignItems: 'center', justifyContent: 'space-between' },
        h(M.Chip, { size: 'small', label: ph.label,
          icon: h(M.Box, { component: 'span', sx: { width: 8, height: 8, borderRadius: 99, bgcolor: ph.dot, ml: '8px !important' } }),
          sx: { bgcolor: C.soft, color: 'text.primary', height: 26, fontSize: 12, border: '1px solid ' + C.line } }),
        h(M.Typography, { variant: 'caption', color: 'text.secondary', sx: { fontVariantNumeric: 'tabular-nums' } },
          'Frame ', h('b', { style: { color: C.ink, fontWeight: 600 } }, Math.floor(f + 0.0001)), ' / ' + Math.round(st.total || 0))),
      h(M.Slider, {
        value: v, min: 0, max: total, step: 0.01, track: false, disabled: !st.total, 'aria-label': 'Scrub frames',
        marks: entry.intro && st.success === 'none' ? [{ value: entry.intro[1] }] : [],
        onChange: function(e, val){ ctl.scrubMove(val); },
        onChangeCommitted: function(e, val){ ctl.scrubEnd(val); },
        sx: { mt: 0.5, '& .MuiSlider-rail': { background: rail } }
      }),
      entry.intro && st.success === 'none'
        ? h(M.Stack, { direction: 'row', spacing: 2, sx: { mt: -0.5 } },
            [['Intro · plays once', C.blue200], ['Loop', C.blue]].map(function(x){
              return h(M.Stack, { key: x[0], direction: 'row', spacing: 0.75, alignItems: 'center' },
                h(M.Box, { sx: { width: 14, height: 6, borderRadius: 3, bgcolor: x[1] } }),
                h(M.Typography, { variant: 'caption', color: 'text.secondary' }, x[0]));
            }))
        : null);
  }

  function PlaybackCard(p){
    var st = p.st, entry = p.entry;
    return h(SectionCard, { sx: { mt: 2 } },
      h(Timeline, { st: st, entry: entry }),
      h(M.Stack, { direction: 'row', spacing: 1, sx: { mt: 2 } },
        h(M.Button, { variant: 'outlined', size: 'large', onClick: ctl.replay, startIcon: h(Icon.replay, null), sx: { flex: 1 } }, 'Replay'),
        h(M.Button, { variant: 'contained', size: 'large', onClick: ctl.togglePlay, sx: { flex: 1.35 },
          startIcon: h(st.paused ? Icon.play : Icon.pause, null), 'aria-label': st.paused ? 'Play' : 'Pause' }, st.paused ? 'Play' : 'Pause'),
        h(M.Tooltip, { title: 'Playback speed' },
          h(M.Button, { variant: 'outlined', size: 'large', onClick: ctl.cycleSpeed, startIcon: h(Icon.speed, null),
            sx: { flex: 1, fontVariantNumeric: 'tabular-nums' } }, SPEEDS[st.speedIx] + '×'))));
  }

  /* Background picker: a short bottom drawer opened from the palette button in the top bar.
     Invisible backdrop (tap outside closes): the stage keeps its true colour while choosing, and
     iOS Safari 26 doesn't tint its bars from a scrim. The drawer unmounts when closed. */
  function BackgroundDrawer(p){
    var st = p.st;
    return h(M.Drawer, {
        anchor: 'bottom', open: p.open, onClose: p.onClose,
        transitionDuration: PG.reduce ? 0 : { enter: 260, exit: 200 },
        slotProps: { backdrop: { invisible: true } },
        PaperProps: { sx: { borderRadius: '24px 24px 0 0', maxWidth: 480, mx: 'auto', left: 0, right: 0,
          px: 2, pt: 1, pb: 'calc(env(safe-area-inset-bottom, 0px) + 20px)', boxShadow: PG.theme.shadows[4] } }
      },
      h(M.Box, { sx: { width: 36, height: 4, borderRadius: 2, bgcolor: '#d5dbde', mx: 'auto', mb: 1.5 } }),
      h(M.Stack, { direction: 'row', alignItems: 'baseline', justifyContent: 'space-between', sx: { px: 0.5, mb: 1.5 } },
        h(M.Typography, { variant: 'h6' }, 'Background'),
        h(M.Typography, { variant: 'caption', color: 'text.secondary' }, 'Behind the animation')),
      h(M.ToggleButtonGroup, { exclusive: true, value: st.bg, 'aria-label': 'Background',
          onChange: function(e, v){ if (v) ctl.setBg(v); },
          sx: { display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 1,
            '& .MuiToggleButton-root': { flexDirection: 'column', gap: 0.75, p: 1, border: '0 !important', borderRadius: '16px !important',
              color: 'text.secondary', fontSize: 12, fontWeight: 600,
              '&.Mui-selected': { bgcolor: C.blue50, color: 'primary.main', '&:hover': { bgcolor: C.blue50 } } } } },
        Object.keys(BG).map(function(k){
          var on = st.bg === k;
          return h(M.ToggleButton, { key: k, value: k, 'aria-label': BG[k].label },
            h(M.Box, { sx: Object.assign({ width: '100%', aspectRatio: '1 / 1', borderRadius: '14px',
              boxShadow: on ? '0 0 0 2px ' + C.blue : 'inset 0 0 0 1px ' + C.line, display: 'grid', placeItems: 'center' }, BG[k].css,
              k === 'grid' ? { backgroundSize: '12px 12px', backgroundPosition: '0 0,6px 6px' } : {}) },
              on ? h(Icon.check, { sx: { fontSize: 22, color: k === 'dark' ? '#fff' : 'primary.main' } }) : null),
            BG[k].short || BG[k].label);
        })));
  }

  function DetailsCard(p){
    var st = p.st, e = p.entry, m = st.meta, base = e.slug + '/', gs = st.renderer === 'gsap' && e.gsap;
    function row(k, v){
      return h(M.Stack, { key: k, direction: 'row', justifyContent: 'space-between', spacing: 2, sx: { py: 0.75 } },
        h(M.Typography, { variant: 'body2', color: 'text.secondary' }, k),
        h(M.Typography, { variant: 'body2', sx: { fontWeight: 500, textAlign: 'right' } }, v));
    }
    var playback = e.success ? 'Loading loops → success once' : e.intro ? 'Intro ' + e.intro[0] + '–' + e.intro[1] + ' → loop ' + e.loop[0] + '–' + e.loop[1] : 'Plays once, holds the last frame';
    var files = gs ? [e.gsap].concat(e.gsapSuccess ? [e.gsapSuccess] : []) : [e.json].concat(e.success ? [e.success] : [], e.lottie ? [e.lottie] : []);
    return h(SectionCard, { title: 'Details' },
      h(M.Box, { sx: { '& > * + *': { borderTop: '1px solid ' + C.line } } },
        row('Canvas', m ? m.w + ' × ' + m.h : '—'),
        row('Frame rate', m ? (Math.round(m.fps * 100) / 100) + ' fps' : '—'),
        row('Renderer', m ? m.label : '—'),
        row('Playback', playback)),
      h(M.Typography, { variant: 'caption', color: 'text.secondary', sx: { display: 'block', mt: 1.5, mb: 1 } }, 'Files'),
      h(M.Stack, { direction: 'row', useFlexGap: true, flexWrap: 'wrap', spacing: 1 },
        files.map(function(f){
          return h(M.Chip, { key: f, component: 'a', href: base + f, download: true, clickable: true, variant: 'outlined',
            icon: h(Icon.download, { sx: { fontSize: 16 } }), label: f.split('/').pop(),
            sx: { height: 30, borderRadius: '10px', fontWeight: 500, color: 'text.primary', borderColor: C.line, '& .MuiChip-icon': { color: 'primary.main' } } });
        })));
  }

  /* ---------- app ---------- */
  function App(){
    var st = useCtl(), entry = LIST[st.index] || LIST[0];
    var bo = R.useState(false), bgOpen = bo[0], setBgOpen = bo[1];
    R.useEffect(function(){
      function onKey(e){
        if (document.querySelector('.MuiMenu-paper, .MuiDrawer-paper') || (e.target && e.target.closest && e.target.closest('.MuiSlider-root'))) return;
        if (e.key === 'ArrowRight') ctl.go(1);
        else if (e.key === 'ArrowLeft') ctl.go(-1);
        else if (e.key === ' ' && !(e.target && /^(BUTTON|A|INPUT)$/.test(e.target.tagName))) { e.preventDefault(); ctl.togglePlay(); }
      }
      var hid = false;
      function onVis(){ if (document.hidden) hid = ctl.pauseHidden(); else if (hid) { hid = false; ctl.resumeHidden(); } }
      document.addEventListener('keydown', onKey);
      document.addEventListener('visibilitychange', onVis);
      return function(){ document.removeEventListener('keydown', onKey); document.removeEventListener('visibilitychange', onVis); };
    }, []);
    if (!entry) return h(M.Typography, { sx: { p: 3 } }, 'No animations registered.');
    return h(M.Container, { disableGutters: true, sx: {
        maxWidth: 480, px: 2, pt: 'calc(env(safe-area-inset-top, 0px) + 8px)', pb: 'calc(env(safe-area-inset-bottom, 0px) + 32px)' } },
      h(TopBar, { st: st, onBg: function(){ setBgOpen(true); } }),
      h(M.Box, { sx: { textAlign: 'center', mt: 2 } },
        h(M.Typography, { variant: 'h5', component: 'h1' }, entry.title),
        h(M.Typography, { variant: 'body2', color: 'text.secondary', sx: { mt: 0.75, mx: 'auto', maxWidth: 360, minHeight: 40 } }, entry.desc)),
      h(RendererSwitch, { st: st, entry: entry }),
      h(Stage, { st: st, entry: entry }),
      h(Pager, { st: st }),
      h(PlaybackCard, { st: st, entry: entry }),
      h(DetailsCard, { st: st, entry: entry }),
      h(BackgroundDrawer, { st: st, open: bgOpen, onClose: function(){ setBgOpen(false); } }));
  }

  /* boot */
  var rq = (/[?&]r=(lottie|gsap)\b/.exec(location.search) || [])[1];
  renderer = rq || store('ps-lottie-renderer') || 'lottie';
  if (!window.lottie) { document.getElementById('root').textContent = 'Player library failed to load.'; return; }
  PG.mount(document.getElementById('root'), App);
})();
</script>
</body>
</html>
