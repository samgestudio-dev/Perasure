<!-- PeraSure Dev Mode: every page and component of the app demo, inspectable like Figma Dev Mode, with its code, specs, tokens and
     iteration history. Desktop only. Data: data/*.js (index.js is generated by tools/devmode-index.py). Guide: README.md -->

<script>
  /* the theme before anything is drawn, so a dark page never flashes white */
  (function () { var t; try { t = localStorage.getItem('perasure.devmode.theme'); } catch (e) {} t = t || 'system';
    document.documentElement.setAttribute('data-theme', t === 'system' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : t); })();
</script>
