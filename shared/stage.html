<title>PeraSure component stage</title>
<!-- One state of one gallery entry, alone on the page: what PeraSure Dev Mode shows in its canvas for a component.
     ?entry=<gallery entry name>&state=<index>. The entries live in gallery.js / gallery-app.js (the same as the old gallery page). -->
<link rel="stylesheet" href="../tokens/tokens.css">
<link rel="stylesheet" href="../tokens-rem/tokens-rem.css?v=202611170855">
<link rel="stylesheet" href="../assets/fonts/fonts-2026.11.17.css">

<style>
  html, body { margin: 0; min-height: 100%; background: var(--color-surface-page-default); }
  .st { padding: 16px; }
  .st-missing { padding: 24px 16px; color: var(--color-text-tertiary); font: 14px/20px var(--font-family-body); }
  .g-row { display: flex; gap: 8px; align-items: center; }
  .g-frame { position: relative; width: calc(100% + 32px); margin: -16px; overflow: hidden; background: var(--color-surface-page-default); isolation: isolate; }
  .g-center { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
</style>
<script>window.PS_STAGE = true;
  /* Dev Mode's Screen fit · rem and Text size (?fit=rem&text=130), sized as shared/ps-ui/phone-fit.js sizes the app: the root font size
     carries the text size up to 130 % (the whole layout follows) and the rem factor; above 130 % only text grows (--ps-tx).
     Without them nothing changes. Dev Mode draws the other fit modes itself (the frame's width and enlargement). */
  (function () {
    var q = new URLSearchParams(location.search), rem = q.get('fit') === 'rem', tx = +q.get('text') || 0, root = document.documentElement;
    if (!rem && !tx) return;
    var med = 16, p = document.createElement('div'); p.style.cssText = 'position:absolute;visibility:hidden;font-size:medium'; root.appendChild(p); med = parseFloat(getComputedStyle(p).fontSize) || 16; p.remove();
    var ts = tx ? Math.max(0.85, Math.min(2, tx / 100)) : 1, ui = Math.min(ts, 1.3), fz = rem ? Math.max(1, Math.min(1.15, Math.min(innerWidth, 600) / 360)) : 1;
    root.style.fontSize = Math.round(ui * fz * 16 / med * 100000) / 1000 + '%';
    root.style.setProperty('--ps-tx', String(Math.round(ts / ui * 10000) / 10000));
    root.classList.toggle('ps-text-big', ts > 1.01);
  })();
</script>
</head>
<body>
<div id="root"></div>

<script src="gallery.js?v=202611170855"></script>
<script>
  (function () {
    var R = window.React, M = window.Motion, PS = window.PS, h = R.createElement, q = new URLSearchParams(location.search);
    var name = q.get('entry'), idx = +q.get('state') || 0, item = null;
    (PS.GALLERY || []).forEach(function (g) { g.items.forEach(function (it) { if (it.name === name) item = it; }); });
    function Stage() {
      var st = item && (item.states[idx] || item.states[0]);
      return h(M.LazyMotion, { features: M.domMax, strict: true }, h(M.MotionConfig, { reducedMotion: 'user' },
        st ? h('div', { className: 'st' }, st[1]()) : h('p', { className: 'st-missing' }, 'No gallery entry called “' + name + '”.')));
    }
    PS.mount(Stage);
  })();
</script>
