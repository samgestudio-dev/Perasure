  .g-row { display: flex; gap: 8px; align-items: center; }

<script>
  (function () {
    var R = window.React, M = window.Motion, PS = window.PS, h = R.createElement, q = new URLSearchParams(location.search);
    var name = q.get('entry'), idx = +q.get('state') || 0, item = null;
    (PS.GALLERY || []).forEach(function (g) { g.items.forEach(function (it) { if (it.name === name) item = it; }); });
    function Stage() {
      var st = item && (item.states[idx] || item.states[0]);
      return h(M.LazyMotion, { features: M.domMax, strict: true }, h(M.MotionConfig, { reducedMotion: 'user' },
        st ? h('div', { className: 'st' }, st[1]()) : h('p', { className: 'st-missing' }, 'No gallery entry called “' + name + '”.')));
    }
    PS.mount(Stage);
  })();
</script>
